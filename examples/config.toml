# Copy to ~/.config/jms-bridge/config.toml and fill in the credential file.
[bastion]
url = "https://bastion.example.com"
ssh_port = 2224
login_user = "your-login"

# Optional: raise the fan-out ceiling for many-target reads.
# max_parallel = 8
# inspection_parallel = 4
# queue_limit = 64
# inspection_queue_limit = 16
# queue_timeout = 60
#
# Proxy for the REST API and SSH when the bastion is only reachable through one.
# proxy = "http://proxy.internal:8080"
#
# Set to false only for a bastion with a self-signed certificate.
# verify_tls = true

# Optional state location (results, request receipts, inventory cache).
# state_dir = "~/.local/state/jms-bridge"
# result_ttl_seconds = 604800
# result_cleanup_interval_seconds = 3600
